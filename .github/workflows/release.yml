# Builds every bundle for a tagged version and attaches them to a draft release.
#
#   bun run bump   → pick a version; it commits, tags vX.Y.Z and pushes
#   the tag push   → this
#
# The release is left as a *draft*: check the artifacts, write the notes, then
# publish.
#
# Three separate signatures, none of which is the other: TAURI_SIGNING_* proves an
# *update* came from us, the APPLE_* secrets are Gatekeeper's, and the Android
# keystore is the identity a phone checks before it will replace an install. Each
# is skipped when its secret is absent — the build still succeeds, it just ships a
# bundle the OS warns about (and, for Android, one that cannot upgrade an earlier
# install). Windows is the one that is still unsigned — and the fix there is not
# another secret: signing the installer after the bundler has already signed it
# invalidates the updater signature, exactly as the AppImage repack below does.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Baked into the frontend bundle at build time (nuxt.config runtimeConfig).
env:
  TMDB_API: ${{ secrets.TMDB_API }}
  # Node sizes its heap from the machine's RAM, and the macOS runner has half of
  # what the others do — so `nuxt generate` prerendering 72 locales died at a
  # 2 GB ceiling there while passing everywhere else. Give every runner the same
  # headroom rather than the Mac a special case.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the .deb and .AppImage link against the
          # runner's glibc, so building on the oldest supported one is what
          # makes them run anywhere else.
          - os: ubuntu-22.04
            args: ''
            targets: ''
          # Native, so NSIS *and* the .msi come out — neither cross-compiles.
          - os: windows-latest
            args: ''
            targets: ''
          # Apple Silicon only. A universal build would have to link a universal
          # libmpv, and Homebrew bottles are single-arch — the x86_64 half fails
          # at the linker. An Intel .dmg needs an Intel runner, not a flag.
          - os: macos-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      # Windows ships no mpv, so the bundle carries one (tauri.windows.conf.json).
      - if: runner.os == 'Windows'
        run: bun scripts/build/mpv.ts

      # macOS links libmpv instead of launching mpv, so it is needed to build at
      # all. Carrying it — and the ffmpeg tree behind it — into the .app is then
      # scripts/build/macos/bundle-dylib.ts, via the beforeBundleCommand hook,
      # which needs only otool and install_name_tool from the Xcode command line
      # tools the runner image already has.
      - if: runner.os == 'macOS'
        run: brew install mpv

      # Uploads the bundles *and* latest.json, which is what the in-app updater
      # reads. Each runner merges its own platforms into the copy already on the
      # release, so one file ends up describing all three — and it is written
      # only if the bundler produced .sig files, i.e. only if the signing key
      # below actually reached it. A release with no latest.json means that
      # secret is missing: the app then still says a version is out, and points
      # at the release page instead of installing it.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's own ancient `strip` fails on .relr.dyn — see scripts/build/index.ts.
          NO_STRIP: 1
          # The other half of `plugins.updater.pubkey` in tauri.conf.json. Lose
          # this key and no existing install can ever be updated again, because
          # a new keypair's signatures fail against the public key they shipped
          # with — so it lives in the repo secrets and in a backup, nowhere else.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Only needed if the key ever gets a passphrase. Unset is fine: the CLI
          # takes an empty one whenever `CI` is set, which every runner sets. It
          # is wired up so that adding the passphrase is the only step then.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Gatekeeper, which is a different key entirely: the one above proves a
          # *update* came from us, these prove the .app did. Unset — the default —
          # and the .dmg is unsigned, which is the "Ventic is damaged" dialog on
          # every Mac that didn't build it. With an Apple Developer ID in the
          # secrets tauri-action imports it, signs and notarizes, and nothing else
          # about the build changes. Ignored on the other two runners.
          # APPLE_CERTIFICATE is `base64 -i cert.p12`; APPLE_PASSWORD is an
          # app-specific password, never the Apple ID's own.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ventic ${{ github.ref_name }}
          # v1 fails rather than uploading when the tag's release exists and is
          # no longer a draft, so re-running this after publishing is an error
          # and not a silent no-op. Delete the release first, or re-tag.
          releaseDraft: true
          args: ${{ matrix.args }}
          # Windows builds both, and the updater installs whichever this names.
          # NSIS: it is per-user, so `installMode: passive` can run it without a
          # UAC prompt, where the .msi needs admin for a machine-wide install.
          updaterJsonPreferNsis: true
          # latest.json carries every signature inline, and that is the only copy
          # the updater ever reads — so a .sig beside each bundle is six more
          # files on the download page answering a question nobody asked.
          uploadUpdaterSignatures: false

      # tauri-action drives the bundler itself, so scripts/build/index.ts — and
      # the AppImage repack it ends with — never runs here. Do it to the bundle
      # tauri-action left behind and replace the asset it just uploaded, or the
      # AppImage aborts at startup on every distro newer than this runner.
      # The repack rewrites the AppImage, which invalidates the signature the
      # bundler made moments earlier — so the script signs it again (see there),
      # and both files are replaced together. The `updater` job below then puts
      # that signature into latest.json, where it can't race the other runners.
      #
      # The presence check is in the shell, not a step-level `if:`: the `secrets`
      # context is not available there (same as the Android keystore below).
      - if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun scripts/build/linux/appimage.ts
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret — this release ships without in-app updates. The app will point people at the release page instead."
          fi

      # Hand that signature to the `updater` job. A workflow artifact rather than
      # a release asset: it is plumbing between two jobs, and the release page is
      # not the place to park it. Missing when there was no key to sign with,
      # which is a release without in-app updates rather than a failure.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: appimage-signature
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: ignore

      # The runner has Homebrew, so a .dmg that still depends on it looks fine
      # here and fails on every other Mac. Fail the release instead.
      - if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bun scripts/build/macos/bundle-dylib.ts src-tauri/target/release/bundle/macos/Ventic.app

  # `latest.json` is written by all three desktop runners at once, each merging
  # its platforms into the copy already on the release — so the Linux signature
  # can only be corrected once every one of them has finished writing.
  updater:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Absent when the Linux job had no signing key, so this must not fail the
      # release — the script skips on a signature that isn't there.
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: appimage-signature
          path: appimage-signature
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/build/linux/appimage-signature.ts "${{ github.ref_name }}" appimage-signature/*.AppImage.sig

  android:
    # The draft release has to exist before there is anything to upload to.
    needs: desktop
    runs-on: ubuntu-latest
    # The Play upload step is skipped without this. A step-level `if:` cannot read
    # the `secrets` context, but it can read `env` — so the secret is lifted here
    # rather than checked in a shell, the way the keystore below has to be.
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          # armv7 is the TV sets — a lot of them run a 32-bit userspace, and
          # scripts/build/index.ts refuses to start without the target.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # The APK is debug-signed, and the debug key is per-machine — so on a fresh
      # runner every release was signed by a different certificate and the phone
      # rejected each new one as an upgrade. One keystore, held as a secret,
      # keeps that identity stable across releases; see app/build.gradle.kts.
      # Without the secret the build still succeeds, it just falls back to the
      # throwaway key and its APK can't upgrade an earlier install.
      # The `secrets` context is not available in a step-level `if:`, so the
      # presence check is here rather than a condition on the step.
      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ventic.jks"
            echo "Signing with the release keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE secret — this APK gets a throwaway debug key and will not install over an earlier release."
          fi

      # NDK comes from the runner image's ANDROID_NDK_HOME, which scripts/build/index.ts picks up.
      # `--aab` on top of the APK: Play takes only an .aab, and every other way of
      # getting Ventic onto a device takes only an .apk. One build, one keystore,
      # one versionCode — so the store copy and a sideloaded TV are the same app
      # and can replace each other.
      - run: bun run build:android --aab
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ventic.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # An unsigned or wrongly-signed APK is worse than a failed build: it reaches
      # people, fails to install, and every later release inherits the mismatch.
      # Check before it can be uploaded, not after.
      - name: Verify the APK is signed
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk is missing. An *-unsigned.apk here means the keystore secret never reached Gradle."
            ls -la "$(dirname "$apk")" || true
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$apk"

      # Play's own review reads the *first* upload of a versionCode and there is
      # no undo, so this lands on the internal track and is promoted by hand in the
      # console. Nothing happens at all until the service account secret exists.
      - name: Publish to Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.ventic.app
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          track: internal
          status: completed

      - name: Attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mv "$apk" "Ventic_${GITHUB_REF_NAME#v}.apk"
          # The same file twice: the versioned name for the releases page, and an
          # unversioned copy so `releases/latest/download/Ventic.apk` resolves. That
          # URL is what ventic.tv/apk redirects to and what a television's Downloader
          # app fetches, and it only works if the name never carries the version.
          cp "Ventic_${GITHUB_REF_NAME#v}.apk" Ventic.apk
          gh release upload "$GITHUB_REF_NAME" "Ventic_${GITHUB_REF_NAME#v}.apk" Ventic.apk --clobber
