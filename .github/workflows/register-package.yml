# One-off: prove ownership of com.ventic.app to Google's package registration.
#
# Google wants an APK carrying an account-unique token at
# assets/adi-registration.properties, signed by the key that already signs our
# releases — and that key exists nowhere but the ANDROID_KEYSTORE secret, so the
# signing has to happen here rather than on a laptop. Nothing is built: the
# published APK is re-signed, which is all the check reads ("You do not need to
# upload the actual APK that you distribute"). Delete this once com.ventic.app
# is registered.
name: Register package name

on:
  workflow_dispatch:
    inputs:
      token:
        description: The snippet Play Console shows under "How to sign an APK"
        required: true

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the published APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern Ventic.apk

      # The token goes through the environment rather than into the script text:
      # a workflow_dispatch input interpolated into a shell body is an injection
      # seam, owner-only trigger or not.
      - name: Inject the token and re-sign
        env:
          TOKEN: ${{ inputs.token }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME"/build-tools/36.0.0
          mkdir -p assets
          printf '%s' "$TOKEN" > assets/adi-registration.properties
          zip -X -q Ventic.apk assets/adi-registration.properties
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > ks.jks
          "$bt"/zipalign -p -f 4 Ventic.apk aligned.apk
          # env: rather than pass: — pass: puts the password in the process table.
          "$bt"/apksigner sign --ks ks.jks \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out ventic-registration.apk aligned.apk
          rm -f ks.jks

      # Uploading an APK signed by the wrong key would burn the attempt and say
      # nothing useful about why, so check the fingerprint is the one the console
      # is asking for before it can leave the runner.
      - name: Check it carries the registered key
        run: |
          set -euo pipefail
          want=36:DB:04:3D:4B:D2:41:86:F3:9C:77:E7:E5:56:C4:A5:29:6E:90:03:3A:67:48:C8:3B:24:32:81:C7:46:05:A1
          got=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs-pem ventic-registration.apk \
                | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$got" = "$want" ] || { echo "::error::signed with $got, expected $want"; exit 1; }
          unzip -p ventic-registration.apk assets/adi-registration.properties
          echo "✓ $got"

      - uses: actions/upload-artifact@v4
        with:
          name: ventic-registration-apk
          path: ventic-registration.apk
