<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
<!-- The Android TV launcher banner, and the source of both copies of it:
     res/drawable-xhdpi/tv_banner.png (320x180) and the Play listing's
     docs/media/play/tv-banner.png (1280x720, no alpha). Play's TV review
     rejects a banner without the app's name in it (TV-BN) or one that doesn't
     fill its frame, so the name is part of the picture and the background is
     the whole canvas. The word is Roboto Bold turned into outlines, so this
     renders the same with no font installed; the mark is public/logo.svg's. -->
