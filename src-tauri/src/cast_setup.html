<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventic</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px 16px 48px; background: #221e1f; color: #e8e7e7;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 26rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; opacity: .7; }
  label { display: block; margin-bottom: 1rem; font-size: .875rem; opacity: .9; }
  select, input {
    display: block; width: 100%; box-sizing: border-box; margin-top: .375rem;
    /* 16px or larger, or iOS Safari zooms the page on focus. */
    padding: .75rem; font-size: 1rem; color: inherit;
    background: #2c2829; border: 1px solid #4c494a; border-radius: .75rem;
  }
  button {
    width: 100%; padding: .9rem; font-size: 1rem; font-weight: 600;
    color: #3d0508; background: #ff5555; border: 0; border-radius: 999px;
  }
  button[disabled] { opacity: .5; }
  #msg { min-height: 1.5rem; margin: 1rem 0 0; text-align: center; }
  #msg.bad { color: #ffb4ab; }
  #msg.good { color: #ff5555; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Ventic</h1>
  <p class="sub">Type it here — the TV asks before it adds anything.</p>

  <form id="form">
    <label>What are you adding?
      <select id="kind" name="kind">
        <option value="source">A source (addon URL)</option>
        <option value="playlist">A TV playlist (M3U link)</option>
        <option value="xtream">An Xtream login</option>
        <option value="sync">A WebDAV folder to sync with</option>
      </select>
    </label>

    <label><span id="urlLabel">Source URL</span>
      <input id="url" name="url" required inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://">
    </label>

    <div id="creds" hidden>
      <label>Username
        <input id="user" name="user" autocapitalize="off" autocorrect="off" spellcheck="false">
      </label>
      <label>Password
        <input id="pass" name="pass" type="password">
      </label>
    </div>

    <label>Code shown on the TV
      <input id="code" name="code" inputmode="numeric" maxlength="4" autocomplete="off">
    </label>

    <button id="send">Send to the TV</button>
  </form>

  <p id="msg"></p>
</main>

<script>
  var LABELS = {
    source: 'Source URL',
    playlist: 'Playlist link',
    xtream: 'Server address',
    sync: 'WebDAV address'
  }
  var kind = document.getElementById('kind')
  var msg = document.getElementById('msg')
  var send = document.getElementById('send')

  // The pairing code rides in the QR so nobody has to read it off the screen;
  // typed-in visitors fill the box themselves.
  var code = new URLSearchParams(location.search).get('c')
  if (code) document.getElementById('code').value = code

  function shape() {
    document.getElementById('urlLabel').textContent = LABELS[kind.value]
    document.getElementById('creds').hidden = kind.value !== 'xtream' && kind.value !== 'sync'
  }
  kind.onchange = shape
  shape()

  document.getElementById('form').onsubmit = function (e) {
    e.preventDefault()
    msg.className = ''
    msg.textContent = 'Sending…'
    send.disabled = true
    fetch('/ventic/setup', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        code: document.getElementById('code').value.trim(),
        kind: kind.value,
        url: document.getElementById('url').value.trim(),
        user: document.getElementById('user').value.trim(),
        pass: document.getElementById('pass').value
      })
    }).then(function (res) {
      msg.className = res.ok ? 'good' : 'bad'
      msg.textContent = res.ok
        ? 'Sent. Say yes on the TV to add it.'
        : res.status === 403
          ? 'That code doesn\'t match the one on the TV.'
          : 'The TV wouldn\'t take that. Check what you typed.'
    }).catch(function () {
      msg.className = 'bad'
      msg.textContent = 'Couldn\'t reach the TV. Is it still on this screen?'
    }).then(function () {
      send.disabled = false
    })
  }
</script>
</body>
</html>
